<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字员工平台 管理后台</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e7e9ee; --line2:#f0f1f4; --ink:#111827; --sub:#6b7280; --sub2:#9ca3af;
    --pri:#3b5bdb; --pri-d:#2f4ac0; --pri-soft:#eef2ff;
    --ok:#16a34a; --ok-soft:#ecfdf3; --warn:#d97706; --warn-soft:#fffbeb; --err:#dc2626; --err-soft:#fef2f2;
    --nav:#0f172a; --nav-2:#1e293b; --nav-ink:#94a3b8; --nav-label:#64748b;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  a{ color:var(--pri); text-decoration:none; } a:hover{ text-decoration:underline; }
  button{ font:inherit; cursor:pointer; }
  .btn{ background:var(--pri); color:#fff; border:1px solid var(--pri); border-radius:8px; padding:7px 16px; font-weight:500;
        transition:background .15s,border-color .15s,box-shadow .15s; }
  .btn:hover{ background:var(--pri-d); border-color:var(--pri-d); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; }
  .btn.ghost{ background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:400; }
  .btn.ghost:hover{ background:#f9fafb; border-color:#d1d5db; }
  .btn.danger{ background:#fff; color:var(--err); border:1px solid #fecaca; padding:4px 10px; font-size:13px; font-weight:400; }
  .btn.danger:hover{ background:var(--err-soft); }
  .btn.sm{ padding:4px 12px; font-size:13px; }
  input,textarea,select{ font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
        background:#fff; color:var(--ink); transition:border-color .15s,box-shadow .15s; }
  input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--pri); box-shadow:0 0 0 3px rgba(59,91,219,.12); }
  textarea{ resize:vertical; min-height:100px; font-family:inherit; }
  label{ display:block; font-size:13px; color:var(--sub); margin:14px 0 6px; font-weight:500; }

  /* 登录 */
  #login{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:50;
          background:radial-gradient(1200px 600px at 20% 10%,#e0e7ff 0,transparent 60%),var(--bg); }
  #login .box{ width:360px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px; box-shadow:0 12px 40px rgba(15,23,42,.08); }
  #login h1{ font-size:20px; margin:0 0 4px; } #login p{ color:var(--sub); margin:0 0 18px; font-size:13px; }
  #login .err{ color:var(--err); font-size:13px; min-height:18px; margin-top:10px; }

  /* 骨架：深色侧边栏 + 右侧内容 */
  #app{ display:none; }
  .layout{ display:flex; min-height:100vh; }
  nav{ width:224px; flex:0 0 224px; background:var(--nav); color:var(--nav-ink); position:sticky; top:0; height:100vh;
       overflow-y:auto; padding:0 10px 20px; }
  nav .brand{ display:flex; align-items:center; gap:10px; padding:18px 10px 14px; color:#fff; font-weight:600; font-size:15px; }
  nav .brand .mark{ width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#6366f1,#3b82f6);
       display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  nav .brand small{ display:block; color:var(--nav-label); font-weight:400; font-size:11px; margin-top:-2px; }
  nav .nlabel{ font-size:11px; letter-spacing:.06em; color:var(--nav-label); padding:16px 12px 6px; font-weight:600; }
  nav a{ display:flex; align-items:center; gap:10px; padding:7px 12px; margin:1px 0; color:var(--nav-ink); font-size:13.5px;
         border-radius:8px; transition:background .12s,color .12s; }
  nav a:hover{ background:var(--nav-2); color:#e2e8f0; text-decoration:none; }
  nav a.on{ background:rgba(99,102,241,.18); color:#fff; font-weight:500; }
  nav a.on .ic{ color:#a5b4fc; }
  nav .ic{ width:16px; height:16px; flex:0 0 16px; color:#64748b; }
  nav .badge{ margin-left:auto; background:#ef4444; color:#fff; font-size:11px; border-radius:10px; padding:0 7px; line-height:18px; }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  header{ height:56px; background:rgba(255,255,255,.85); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line);
          display:flex; align-items:center; padding:0 28px; position:sticky; top:0; z-index:10; }
  header .crumb{ color:var(--sub); font-size:13px; } header .crumb b{ color:var(--ink); font-weight:600; }
  header .right{ margin-left:auto; color:var(--sub); display:flex; align-items:center; gap:14px; font-size:13px; }
  main{ padding:24px 28px 48px; max-width:1240px; width:100%; }
  h2{ font-size:20px; margin:0 0 4px; letter-spacing:-.01em; } .desc{ color:var(--sub); margin:0 0 20px; font-size:13px; }
  .head{ display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; } .head .desc{ margin:0; } .head .btn{ margin-left:auto; white-space:nowrap; }

  /* 卡片与统计 */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card-title{ display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:12px; }
  .card-title .muted{ font-weight:400; font-size:12px; } .card-title .btn{ margin-left:auto; }
  .grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
  .stat{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .stat .k{ color:var(--sub); font-size:12.5px; } .stat .v{ font-size:28px; font-weight:650; margin-top:2px; letter-spacing:-.02em; }
  .stat .s{ color:var(--sub2); font-size:12px; }
  .stat.alert{ border-color:#fecaca; background:linear-gradient(180deg,#fff,var(--err-soft)); } .stat.alert .v{ color:var(--err); }
  .stat.warn .v{ color:var(--warn); } .stat.good .v{ color:var(--ok); }
  .chips{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .chip{ padding:3px 10px; border-radius:20px; font-size:12.5px; border:1px solid var(--line); background:#fff;
         white-space:nowrap; display:inline-flex; align-items:center; }
  .chip .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .dot.g{ background:var(--ok); } .dot.r{ background:var(--err); } .dot.y{ background:var(--warn); } .dot:not(.g):not(.r):not(.y){ background:#cbd5e1; }

  .cards{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .appcard{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .appcard h3{ margin:0 0 2px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .appcard .meta{ color:var(--sub); font-size:13px; margin:8px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .appcard .acts{ display:flex; gap:8px; margin-top:12px; }
  .tag{ display:inline-block; font-size:12px; padding:1px 8px; border-radius:6px; background:var(--pri-soft); color:var(--pri); }
  .tag.off{ background:#f3f4f6; color:var(--sub); }

  /* 严重度 / 状态徽章 */
  .sev{ display:inline-block; font-size:11.5px; font-weight:600; padding:1px 8px; border-radius:6px; white-space:nowrap; }
  .sev.critical{ background:#7f1d1d; color:#fff; } .sev.high{ background:var(--err-soft); color:var(--err); }
  .sev.medium,.sev.moderate{ background:var(--warn-soft); color:var(--warn); } .sev.low{ background:#f3f4f6; color:var(--sub); }
  .sev.kev{ background:#dc2626; color:#fff; }
  .st{ display:inline-block; font-size:12px; padding:1px 8px; border-radius:6px; background:#f3f4f6; color:var(--sub); white-space:nowrap; }
  .st.new{ background:var(--pri-soft); color:var(--pri); } .st.triaging{ background:var(--warn-soft); color:var(--warn); }
  .st.affected{ background:var(--err-soft); color:var(--err); } .st.fixed{ background:var(--ok-soft); color:var(--ok); }
  .bar{ height:6px; background:#f1f5f9; border-radius:4px; overflow:hidden; min-width:50px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,#f59e0b,#dc2626); }

  /* 表格 */
  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line2); vertical-align:middle; }
  th{ color:var(--sub); font-weight:500; font-size:12.5px; background:#fafbfc; position:sticky; top:56px; z-index:1; }
  thead th:first-child{ border-top-left-radius:8px; } thead th:last-child{ border-top-right-radius:8px; }
  tbody tr:hover td{ background:#fafbff; } tbody tr:last-child td{ border-bottom:0; }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .muted{ color:var(--sub); } .mono{ font-family:var(--mono); font-size:12px; }
  .clip{ max-width:0; width:100%; } .clip > *{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabs{ display:inline-flex; gap:2px; margin-bottom:14px; background:#eef0f4; padding:3px; border-radius:9px; }
  .tabs button{ background:transparent; border:0; border-radius:7px; padding:5px 14px; color:var(--sub); }
  .tabs button.on{ background:#fff; color:var(--ink); box-shadow:var(--shadow); font-weight:500; }
  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input,.toolbar select{ width:auto; min-width:120px; padding:6px 10px; }
  .toolbar .grow{ flex:1; min-width:200px; }
  .pager{ display:flex; align-items:center; gap:10px; justify-content:flex-end; margin-top:12px; color:var(--sub); font-size:13px; }
  .row{ display:flex; gap:14px; } .row>div{ flex:1; }
  .save-bar{ margin-top:18px; display:flex; align-items:center; gap:12px; }
  .hint{ color:var(--sub); font-size:12px; margin-top:4px; }
  .empty{ color:var(--sub); padding:36px; text-align:center; }
  .notice{ border:1px solid #fde68a; background:var(--warn-soft); color:#92400e; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  .bubble{ padding:8px 12px; border-radius:10px; margin:6px 0; max-width:80%; white-space:pre-wrap; word-break:break-word; }
  .bubble.user{ background:var(--pri-soft); } .bubble.assistant{ background:#f3f4f6; }
  .bubble .who{ font-size:11px; color:var(--sub); margin-bottom:2px; }
  .ev{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line2); }
  .ev:last-child{ border-bottom:0; }
  .ev .t{ flex:0 0 64px; color:var(--sub); font-size:12px; font-variant-numeric:tabular-nums; padding-top:2px; }
  .ev .b{ flex:1; min-width:0; }
  .ev .txt{ white-space:pre-wrap; word-break:break-word; margin-top:4px; }
  .ev pre, pre.box{ background:#f8fafc; border:1px solid var(--line2); border-radius:8px; padding:8px 10px; margin:6px 0 0; white-space:pre-wrap;
    word-break:break-all; font-size:12px; max-height:360px; overflow:auto; font-family:var(--mono); }
  .ev details summary{ cursor:pointer; color:var(--sub); font-size:12px; margin-top:4px; }
  .etype{ font-family:var(--mono); font-size:11.5px; padding:1px 8px; border-radius:6px; background:#f3f4f6; color:var(--sub); margin-right:8px; }
  .etype.tool{ background:#fff7ed; color:#c2410c; } .etype.asst{ background:var(--pri-soft); color:var(--pri); }
  .toolpick{ display:grid; gap:8px; grid-template-columns:1fr 1fr; }
  .toolpick label{ display:flex; gap:8px; align-items:flex-start; margin:0; padding:8px 10px; border:1px solid var(--line);
        border-radius:8px; cursor:pointer; color:var(--ink); font-size:13px; font-weight:400; }
  .toolpick label:hover{ border-color:#c7d2fe; background:#fafbff; }
  .toolpick input{ width:auto; margin-top:3px; }
  .toolpick .tn{ font-family:var(--mono); font-size:12px; }
  .toolpick .td{ color:var(--sub); font-size:12px; }
  .kv{ display:grid; grid-template-columns:120px 1fr; gap:6px 14px; font-size:13px; } .kv dt{ color:var(--sub); } .kv dd{ margin:0; }

  #modal{ position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:flex-start;
          justify-content:center; z-index:40; overflow:auto; padding:48px 16px; }
  #modal .dlg{ width:680px; max-width:100%; background:#fff; border-radius:16px; padding:24px 26px; box-shadow:0 20px 50px rgba(15,23,42,.25); }
  #modal h3{ margin:0 0 4px; font-size:17px; }
  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#111827; color:#fff;
          padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.2); }
  #toast.show{ opacity:1; }
  @media (max-width:860px){ nav{ width:64px; flex-basis:64px; padding:0 6px; } nav .nlabel, nav a span.t, nav .brand .bt{ display:none; }
    nav a{ justify-content:center; } main{ padding:16px; } header{ padding:0 16px; } .row{ flex-direction:column; } .toolpick{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>数字员工平台</h1>
    <p>内部服务 · 请登录</p>
    <label>用户名</label><input id="lg-u" autocomplete="username">
    <label>密码</label><input id="lg-p" type="password" autocomplete="current-password">
    <div style="margin-top:18px"><button class="btn" style="width:100%" onclick="doLogin()">登录</button></div>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <nav>
      <div class="brand"><div class="mark">AI</div><div class="bt">数字员工平台<small>harness 控制台</small></div></div>
      <a data-page="overview" data-ic="home" class="on"><span class="t">概览</span></a>
      <div class="nlabel">数字员工</div>
      <a data-page="apps" data-ic="bot"><span class="t">应用</span></a>
      <a data-page="providers" data-ic="cpu"><span class="t">AI 供应商</span></a>
      <a data-page="skills" data-ic="book"><span class="t">技能</span></a>
      <a data-page="mcp" data-ic="plug"><span class="t">MCP 工具</span></a>
      <a data-page="schedules" data-ic="clock"><span class="t">定时任务</span></a>
      <a data-page="hooks" data-ic="plug"><span class="t">Webhook 触发</span></a>
      <div class="nlabel">安全</div>
      <a data-page="vulns" data-ic="shield"><span class="t">漏洞台账</span><span class="badge" id="nav-vuln-badge" style="display:none"></span></a>
      <a data-page="intel" data-ic="radar"><span class="t">情报源</span></a>
      <div class="nlabel">工程</div>
      <a data-page="code" data-ic="branch"><span class="t">代码仓库</span></a>
      <a data-page="tasks" data-ic="activity"><span class="t">任务中心</span></a>
      <a data-page="patrols" data-ic="activity"><span class="t">持续巡检</span></a>
      <a data-page="runs" data-ic="activity"><span class="t">运行记录</span></a>
      <div class="nlabel">运维集成</div>
      <a data-page="connections" data-ic="key"><span class="t">连接凭证</span></a>
      <a data-page="obs" data-ic="chart"><span class="t">可观测(日志)</span></a>
      <a data-page="ssh" data-ic="terminal"><span class="t">SSH 运维</span></a>
      <a data-page="k8s" data-ic="boxes"><span class="t">K8s 运维</span></a>
      <div class="nlabel">数据</div>
      <a data-page="memory" data-ic="db"><span class="t">记忆系统</span></a>
      <a data-page="usage" data-ic="bars"><span class="t">Token 用量</span></a>
      <div class="nlabel">系统</div>
      <a data-page="account" data-ic="user"><span class="t">账号</span></a>
    </nav>
    <div class="main">
      <header>
        <div class="crumb" id="crumb"></div>
        <div class="right"><span id="who"></span><button class="btn ghost sm" onclick="doLogout()">退出</button></div>
      </header>
      <main id="content"></main>
    </div>
  </div>
</div>

<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const fmt = n => (n==null?0:Number(n)).toLocaleString('en-US');
const dt  = ts => ts ? new Date(ts*1000).toLocaleString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'}) : '';
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function openModal(html){ $('#dlg').innerHTML=html; $('#modal').style.display='flex'; }
function closeModal(){ $('#modal').style.display='none'; }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

async function api(method, path, body){
  const opt={ method, headers:{} };
  if(body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  if(r.status===401){ showLogin(); throw new Error('未登录'); }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.detail || ('HTTP '+r.status));
  return data;
}

/* ---------- 登录 ---------- */
function showLogin(){ $('#app').style.display='none'; $('#login').style.display='flex'; }
async function doLogin(){
  $('#lg-err').textContent='';
  try{ const r=await api('POST','/api/login',{username:$('#lg-u').value,password:$('#lg-p').value}); enterApp(r.username); }
  catch(e){ $('#lg-err').textContent=e.message; }
}
async function doLogout(){ try{ await api('POST','/api/logout'); }catch(e){} showLogin(); }
function enterApp(username){ $('#login').style.display='none'; $('#app').style.display='block'; $('#who').textContent=username; go(location.hash.slice(1)||'overview'); refreshNavBadge();
  api('GET','/api/me').then(m=>{ if(m.stale) showStale(); }).catch(()=>{}); }
$('#lg-p').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

/* ---------- 路由 ---------- */
const PAGES = { patrols: patrolsPage, tasks: tasksPage, overview, apps, providers, skills, mcp, code: codePage, schedules, memory, runs: runsPage, usage, obs, ssh, k8s, account,
  vulns: vulnsPage, intel: intelPage, connections: connectionsPage, hooks: hooksPage };
function go(page){
  if(!PAGES[page]) page='overview';
  let group='';
  document.querySelectorAll('nav > *').forEach(el=>{
    if(el.classList.contains('nlabel')) group=el.textContent;
    if(el.tagName==='A'){ const on=el.dataset.page===page; el.classList.toggle('on',on);
      if(on) $('#crumb').innerHTML=(group?esc(group)+' / ':'')+'<b>'+esc(el.querySelector('.t').textContent)+'</b>'; }
  });
  if(location.hash.slice(1)!==page) history.replaceState(null,'','#'+page);
  PAGES[page]();
}
/* 菜单图标（线框，24 视框） */
const ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 17h6"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/>',
  plug:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M12 8v5M12 16h.01"/>',
  radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18 6"/>',
  branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-11 7"/>',
  activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',

async function renderVulns(){

  const r=await api('GET','/api/vulns?'+p.toString()); const st=r.stats||{};
  $('#vuln-stats').innerHTML=`
    <div class="stat ${st.kev?'alert':''}"><div class="k">在野利用（KEV）</div><div class="v">${fmt(st.kev)}</div></div>
    <div class="stat warn"><div class="k">待研判</div><div class="v">${fmt(st.triage)}</div></div>
    <div class="stat ${st.affected?'alert':'good'}"><div class="k">受影响</div><div class="v">${fmt(st.affected)}</div></div>
    <div class="stat good"><div class="k">已修复</div><div class="v">${fmt((st.by_status||{}).fixed)}</div></div>

  const b=$('#vuln-body');

  b.innerHTML=`<table><thead><tr><th style="width:150px">CVE</th><th>标题 / 产品</th><th style="width:84px">严重度</th><th style="width:120px">EPSS</th>
      <th class="num" style="width:70px" title="社区舆情提及次数 / 全部来源提及次数">舆情</th><th style="width:92px">状态</th><th style="width:110px">最近出现</th></tr></thead><tbody>
    ${r.items.map(x=>`<tr style="cursor:pointer" onclick="viewVuln('${esc(x.cve)}')">
      <td><div class="mono">${esc(x.cve)}</div>${x.kev?'<span class="sev kev">KEV 在野利用</span>':''}</td>
      <td class="clip"><div>${esc(x.title||'(暂无标题)')}</div><div class="muted" style="font-size:12px">${esc((x.products||[]).slice(0,3).join(' · ')||(x.sources||[]).slice(0,2).join(' · '))}</div></td>
      <td>${sevBadge(x.severity)}</td><td>${epssBar(x.epss)}</td>
      <td class="num">${x.social?'<b>'+x.social+'</b>':'<span class="muted">0</span>'} <span class="muted">/ ${x.mentions}</span></td>
      <td><span class="st ${esc(x.status)}">${esc(VULN_ST[x.status]||x.status)}</span></td>
      <td class="muted" style="font-size:12px">${dt(x.last_seen)}</td></tr>`).join('')}</tbody></table>
    <div class="pager">共 ${fmt(r.total)} 条 · 第 ${_vf.offset+1}-${Math.min(_vf.offset+_VLIMIT,r.total)} 条
      <button class="btn ghost sm" ${_vf.offset?'':'disabled'} onclick="_vf.offset=Math.max(0,_vf.offset-${_VLIMIT});renderVulns()">上一页</button>
      <button class="btn ghost sm" ${_vf.offset+_VLIMIT<r.total?'':'disabled'} onclick="_vf.offset+=${_VLIMIT};renderVulns()">下一页</button></div>`;
}

async function saveIntel(id){

    query:$('#is-query').value.trim(),interval_min:Number($('#is-int').value)||60,enabled:Number($('#is-en').value)};

async function fetchIntel(id){

}

/* ---------- 运行记录 ---------- */
const TRIGGER_NAMES={chat:'群聊',proactive:'旁听',schedule:'定时任务',job:'后台任务',webhook:'webhook',delegate:'委派'};
const RUN_STATUS={running:['运行中','y'],completed:['完成','g'],silent:['旁听未发言',''],'max-steps':['轮数用尽','y'],error:['出错','r'],aborted:['中断','r']};
const _RUN_LIMIT=50;
let _runTrigger='', _runStatus='', _runBefore=null;
const durTxt = ms => ms==null?'':(ms<1000?ms+' ms':(ms/1000).toFixed(1)+' s');
const appName = id => { const a=(_appsForFilter||[]).find(x=>String(x.id)===String(id)); return a?a.name:('#'+id); };
function runStatusChip(s){ const [t,c]=RUN_STATUS[s]||[s,'']; return `<span class="chip" style="padding:2px 10px"><span class="dot ${c}"></span>${esc(t)}</span>`; }
async function runsPage(before){
  _runBefore = before||null;
  const c=$('#content'); const filter=await appFilterHtml('runsPage()');
  const sel=(v,opts,on)=>`<select style="width:130px" onchange="${on}">`+opts.map(([k,t])=>`<option value="${k}" ${v===k?'selected':''}>${esc(t)}</option>`).join('')+'</select>';
  c.innerHTML=`<div class="head"><div><h2>运行记录</h2><p class="desc">数字员工每干一次活就是一个 run：模型回复、工具调用和结果按时间线回放，保留 90 天。</p></div>
      <span style="margin-left:auto;display:flex;gap:8px">
        ${sel(_runTrigger,[['','全部触发']].concat(Object.entries(TRIGGER_NAMES)),"_runTrigger=this.value;runsPage()")}
        ${sel(_runStatus,[['','全部状态']].concat(Object.entries(RUN_STATUS).map(([k,v])=>[k,v[0]])),"_runStatus=this.value;runsPage()")}
        ${filter}</span></div>
    <div id="run-body" class="card">加载中…</div>`;
  renderRuns();
}
async function renderRuns(){
  const p=new URLSearchParams();
  if(_appFilter!=='all') p.set('app_id',_appFilter);
  if(_runTrigger) p.set('trigger',_runTrigger);
  if(_runStatus) p.set('status',_runStatus);
  if(_runBefore) p.set('before',_runBefore);
  p.set('limit',_RUN_LIMIT);
  const {runs}=await api('GET','/api/runs?'+p.toString()); const b=$('#run-body');
  if(!runs.length){ b.innerHTML='<div class="empty">'+(_runBefore?'没有更早的记录了。':'还没有运行记录。群里 @ 一下数字员工就会出现。')+'</div>'
    +(_runBefore?'<div style="text-align:center"><button class="btn ghost sm" onclick="runsPage()">← 回到最新</button></div>':''); return; }
  const more = runs.length===_RUN_LIMIT ? `<button class="btn ghost sm" onclick="runsPage(${runs[runs.length-1].started})">更早 →</button>` : '';
  b.innerHTML=`<table><thead><tr><th style="width:160px">开始</th><th>应用</th><th>触发</th><th>状态</th>
      <th class="num">工具调用</th><th class="num">Token</th><th class="num">耗时</th><th style="width:70px"></th></tr></thead><tbody>
    ${runs.map(r=>`<tr><td class="muted">${dt(r.started)}</td><td>${esc(appName(r.app_id))}</td>
      <td>${esc(TRIGGER_NAMES[r.trigger]||r.trigger)}</td><td>${runStatusChip(r.status)}</td>
      <td class="num">${fmt(r.tool_calls)}</td><td class="num">${fmt(r.total_tokens)}</td>
      <td class="num">${r.ended?durTxt(Math.round((r.ended-r.started)*1000)):''}</td>
      <td><button class="btn ghost sm" style="white-space:nowrap" onclick='viewRun(${JSON.stringify(r.id)})'>查看</button></td></tr>`).join('')}</tbody></table>
    <div style="display:flex;justify-content:space-between;margin-top:12px">
      <span>${_runBefore?'<button class="btn ghost sm" onclick="runsPage()">← 回到最新</button>':''}</span><span>${more}</span></div>`;
}
function evBody(e){
  const p=e.payload||{}; const raw=`<details><summary>原始数据</summary><pre>${esc(JSON.stringify(p,null,2))}</pre></details>`;
  switch(e.type){
    case 'run/start': return `<span class="etype">开始</span>模型 ${esc(p.model)}（${esc(p.provider||'')}）· 工具 ${(p.tools||[]).length} 个 · 带入历史 ${p.history_msgs??0} 条${p.policy?' · 策略「'+esc(presetName(p.policy))+'」':''}${p.proactive?' · 旁听模式':''}${raw}`;
    case 'user/message': return `<span class="etype">输入</span><div class="txt">${esc(p.content)}</div>`;
    case 'assistant/message': {
      const calls=(p.tool_calls||[]).map(t=>esc(t.name)).join('、');
      const u=p.usage?` · ${fmt(p.usage.total)} token`:'';
      return `<span class="etype asst">模型${p.fallback?'（轮数用尽兜底）':''}</span><span class="muted">${calls?'调用工具：'+calls:'给出答复'}${u}</span>`
        +(p.content?`<div class="txt">${esc(p.content)}</div>`:'')+raw; }
    case 'tool/call': return `<span class="etype tool">调用</span><b class="mono">${esc(e.tool)}</b>${p.parse_error?' <span style="color:var(--err)">参数解析失败</span>':''}<pre>${esc(JSON.stringify(p.args??p.raw_args,null,2))}</pre>`;
    case 'approval/asked': return `<span class="etype" style="background:#fff7e6;color:#ad6800">待审批</span>已在群里发审批卡片，等待审批人（${(p.approvers||[]).length} 人）处理，最长 ${Math.round((p.timeout_s||0)/60)} 分钟`;
    case 'approval/decided': {
      const t={'allowed-once':['已批准','ok'],rejected:['被拒绝','err'],expired:['超时','err'],cancelled:['已取消','err'],unavailable:['不可用','err']}[p.outcome]||[p.outcome,'err'];
      return `<span class="etype" style="background:#fff7e6;color:#ad6800">审批</span><span style="color:var(--${t[1]})">${t[0]}</span>`
        +(p.decider_open_id?`<span class="muted"> · 审批人 <span class="mono">${esc(p.decider_open_id)}</span></span>`:'')
        +(p.note?`<div class="txt muted">${esc(p.note)}</div>`:''); }
    case 'tool/decision': {
      if(p.decision==='ask') return `<span class="etype" style="background:#fff7e6;color:#ad6800">需审批</span><span class="muted">${esc(p.reason||'')}</span>`;
      if(p.decision==='allow') return `<span class="etype">放行</span><span class="muted">策略「${esc(presetName({preset:p.preset}))}」${p.rule?'第 '+p.rule+' 条规则':''}允许</span>`;
      const by = p.by==='guard' ? '安全检查 '+esc(p.guard) : '策略「'+esc(presetName({preset:p.preset}))+'」';
      return `<span class="etype" style="background:#fff1f0;color:var(--err)">拒绝</span><b>${by}</b><div class="txt" style="color:var(--err)">${esc(p.reason)}</div>`; }
    case 'tool/result': return `<span class="etype tool">结果</span><b class="mono">${esc(e.tool)}</b> `
        +(p.status==='denied'?'<span style="color:var(--err)">未执行（被拒绝）</span>'
          :`<span style="color:var(--${p.status==='error'?'err':'ok'})">${p.status==='error'?'出错':'成功'}</span>`)
        +`<span class="muted"> · ${durTxt(p.duration_ms)} · ${fmt(p.chars)} 字${p.truncated?'（下面只显示前 4000 字）':''}</span>`
        +`<details><summary>结果内容</summary><pre>${esc(p.result)}</pre></details>`;
    case 'run/end': return `<span class="etype">结束</span>${runStatusChip(p.status)} <span class="muted">${durTxt(p.duration_ms)} · ${fmt(p.total_tokens)} token</span>`
        +(p.reason?`<div class="txt" style="color:var(--err)">${esc(p.reason)}</div>`:'');
    default: return `<span class="etype">${esc(e.type)}</span>${raw}`;
  }
}

    <div class="meta" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">

function _collectSshRows(){
  return [...document.querySelectorAll('#ssh-hosts .card')].map(card=>{
    const q=s=>card.querySelector(s);
    const rec={ name:q('.sh-name').value.trim(), host:q('.sh-host').value.trim(),
      aliases:q('.sh-alias').value.trim(),
      port:Number(q('.sh-port').value)||22, username:q('.sh-user').value.trim()||'root' };
    const p=q('.sh-pass').value; if(p) rec.password=p;
    const su=q('.sh-sudo').value; if(su) rec.sudo_password=su;
    const k=q('.sh-key').value; if(k.trim()) rec.key=k;
    return rec;
  });
}
function addSshRow(){ _sshHosts=_collectSshRows(); _sshHosts.push({name:'',host:'',port:22,username:'root'}); renderSshRows(); }
function delSshRow(i){ _sshHosts=_collectSshRows(); _sshHosts.splice(i,1); renderSshRows(); }
async function saveSsh(){
  const hosts=_collectSshRows().filter(h=>h.name&&h.host);

  const res=card.querySelector('.sh-result');

  const hosts=_collectSshRows().filter(h=>h.name&&h.host);
  const name=card.querySelector('.sh-name').value.trim();
  res.textContent=' 连接中…';
  try{
    await api('POST','/api/ssh',{hosts});
    const r=await api('POST','/api/ssh/test',{target:name});
    if(r.error){ res.innerHTML=' <span style="color:#c00">失败：'+esc(r.error)+'</span>'; }
    else{ res.innerHTML=' <span style="color:#080">OK · '+esc((r.stdout||'').trim().replace(/\n/g,' | '))+'</span>'; }
  }catch(e){ res.textContent=' '+e.message; }
}

(async function(){ try{ const me=await api('GET','/api/me'); enterApp(me.username); }catch(e){ showLogin(); } })();
function showStale(){
  const d=document.createElement('div'); d.className='notice';
  d.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.12)';
  d.textContent='后台代码已更新，但服务还没重启：部分页面可能无法加载。请重启服务（概览页「重启服务」或 launchd/容器重启）后刷新。';
  document.body.appendChild(d);
}
